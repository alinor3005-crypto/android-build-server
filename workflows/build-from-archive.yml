name: Build Server API

on:
  repository_dispatch:
    types: [build-request]

  workflow_dispatch:
    inputs:
      source_url:
        description: 'URL to source code archive'
        required: true
      project_id:
        description: 'Project ID'
        required: true
      callback_url:
        description: 'URL to notify when build completes'
        required: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download source archive
        run: |
          curl -L -o source.tar.gz "${{ inputs.source_url }}"
          mkdir -p source
          tar -xzf source.tar.gz -C source

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy downloaded source
        run: |
          cp -r source/* . || true
          cp -r source/.* . || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.project_id }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 1

      - name: Notify callback
        if: inputs.callback_url != ''
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"status":"completed","project_id":"${{ inputs.project_id }}","artifact":"build-${{ inputs.project_id }}"}' \
            "${{ inputs.callback_url }}" || true
